name: Secret Scan

# ─────────────────────────────────────────────────────────────────────────────
#  Secret scanning: the CI half of a two-part control (architecture-standards P5, REPO-BASELINE §2).
#
#      developer machine                    GitHub
#      ┌──────────────────────┐             ┌──────────────────────────┐
#      │ scripts/hooks/       │             │ this workflow            │
#      │   pre-commit         │             │   • full git history     │
#      │   • staged changes   │  ────────▶  │   • every PR, and main   │
#      │   • blocks the commit│             │   • weekly, on schedule  │
#      └──────────────────────┘             └──────────────────────────┘
#        catches the mistake                  catches contributors
#        before it is history                 without hooks
#
#  Findings already in history are listed in .gitleaksignore, so this job guards every new
#  commit rather than failing forever on old ones.
#
#  The scanner image is pinned, so a run today and a run next month read the same rules. Bump the
#  pin deliberately, in its own pull request, and re-run the full-history scan after the bump.
#  There is deliberately no `v*` trigger: this workflow never runs on a tag.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'   # Mondays 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          # A shallow clone would scan only the tip, so a secret added and removed in an
          # earlier commit would pass: the case this job exists to catch.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.19.0 \
            detect --source=/repo \
              --config=/repo/.gitleaks.toml \
              --gitleaks-ignore-path=/repo/.gitleaksignore \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "1. **Rotate the credential** at its provider, now, before anything else."
            echo "2. Remove it from the source; read it from the environment or a gitignored .env."
            echo "3. Only then consider cleaning history."
            echo
            echo "If it is a false positive, mark the line with a \`gitleaks:allow\` comment, or add"
            echo "its fingerprint to \`.gitleaksignore\` with a comment saying why."
            echo "Never allowlist by pasting the real value into a regex."
            echo
            echo "Reproduce locally with \`scripts/install-hooks.sh\` and \`git commit\`, or run gitleaks on the tree."
          } >> "$GITHUB_STEP_SUMMARY"
