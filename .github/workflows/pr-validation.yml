name: PR validation

# ─────────────────────────────────────────────────────────────────────────────
#  Runs what the repository claims to check, and nothing here may fail quietly: no `|| true`,
#  no `--passWithNoTests`. A job whose input does not exist yet is SKIPPED, with the reason in
#  its log, never reported green by pretending to have run.
#
#  • detect-changes — which inputs exist: the solution, Dockerfiles, the kernel-size script.
#  • dotnet         — restore, build (warnings are errors), test. Skipped until PostmanClone.sln exists.
#  • docker-build   — one `docker build` (no push) per Dockerfile under src/. Skipped while there are none.
#  • kernel-size    — scripts/check-kernel-size.sh (the kernel stays ≤ 800 lines, P2). Skipped until it exists.
#  • auth-smoke     — authservice at its pinned tag, built from source against a PostgreSQL service container
#                     (scripts/run-local-stack.sh up), then scripts/smoke-auth.sh (ADR-0004, docs/AUTH.md).
#  • e2e            — the browser journeys (tests/PostmanClone.Web.E2E, ADR-0018): the whole local estate on this runner,
#                     Chromium installed by Playwright, twice: once with the test-only loopback flag (the sender may send to the
#                     local target) and once without it (the default refuses loopback). Runs when src/, tests/, scripts/ or this
#                     workflow changed. POSTMANCLONE_E2E_REQUIRED=1, so a missing prerequisite fails the job, never skips it.
#  • compose-e2e    — the container estate (compose.yaml): the pinned authservice image, the services built from their Dockerfiles, the demo
#                     seed, and the Estate=compose journeys (seeded sign-in, shared collection) in Chromium (ADR-0030, ADR-0031).
#  • aspire-apphost-probe — informational, not in the aggregate: does the real AppHost (DCP) start the estate on this runner (ADR-0031).
#  • docs-links     — every relative link in the Markdown files resolves.
#  • flyio-config   — the Fly workflow has no trigger but workflow_dispatch (scripts/check-flyio-trigger.sh), and the six Fly
#                     configs, the workflow and flyio/SECRETS.md agree (scripts/check-flyio-config.py). No Fly account needed.
#  • pr-validation  — the aggregate check. Its name is the one required status to configure
#                     on `main` (owner action). It fails if any job above failed.
#
#  Draft pull requests are not validated; marking one ready for review runs everything.
#  A newer push cancels the run for the previous one.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'   # the band global.json pins (10.0.100, rollForward latestFeature)
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect inputs
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      solution: ${{ steps.detect.outputs.solution }}
      dockerfiles: ${{ steps.detect.outputs.dockerfiles }}
      kernel: ${{ steps.detect.outputs.kernel }}
      e2e: ${{ steps.detect.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the E2E path filter compares the pull request's base and head

      - name: Detect inputs
        id: detect
        run: |
          set -euo pipefail

          if [ -f PostmanClone.sln ]; then
            echo "solution=true" >> "$GITHUB_OUTPUT"
          else
            echo "solution=false" >> "$GITHUB_OUTPUT"
            echo "No PostmanClone.sln yet: the .NET job is skipped."
          fi

          dockerfiles='[]'
          if [ -d src ]; then
            dockerfiles=$(find src -name Dockerfile -type f | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "dockerfiles=${dockerfiles}" >> "$GITHUB_OUTPUT"
          echo "Dockerfiles: ${dockerfiles}"

          if [ -f scripts/check-kernel-size.sh ]; then
            echo "kernel=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernel=false" >> "$GITHUB_OUTPUT"
            echo "No scripts/check-kernel-size.sh yet: the kernel-size job is skipped."
          fi

          # The browser journeys run on a pull request that changes the code they test, and on a manual run.
          e2e=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            e2e=false
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || echo "unknown")
            if [ "$changed" = "unknown" ] || echo "$changed" | grep -Eq '^(src/|tests/|scripts/|compose\.yaml|\.github/workflows/pr-validation\.yml|Directory\.Packages\.props|PostmanClone\.sln|global\.json)'; then
              e2e=true
            fi
          fi
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"
          echo "E2E journeys: ${e2e}"

  dotnet:
    name: .NET build and tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Turns the PostgreSQL-backed tests on (CONTRACTS, TESTING-STRATEGY): without it they are skipped.
      # The database is a throwaway CI service container; the value is not a credential.
      TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres # gitleaks:allow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (fails on a known-vulnerable package)
        run: dotnet restore PostmanClone.sln

      - name: Build (warnings are errors)
        run: dotnet build PostmanClone.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PostmanClone.sln --configuration Release --no-build

  docker-build:
    name: Docker build (${{ matrix.dockerfile }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.detect-changes.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image (no push)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" .

  kernel-size:
    name: Kernel size
    needs: [detect-changes]
    if: needs.detect-changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the kernel stays within 800 lines
        run: bash scripts/check-kernel-size.sh

  auth-smoke:
    name: authservice smoke (no Docker)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The throwaway CI database (same as the dotnet job). The value is not a credential.
      PG_CONNECTION: Host=localhost;Username=postgres;Password=postgres # gitleaks:allow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start authservice at its pinned tag
        run: scripts/run-local-stack.sh up

      - name: Smoke test the authservice contract
        run: scripts/smoke-auth.sh

      - name: Stop authservice
        if: always()
        run: scripts/run-local-stack.sh down

      - name: authservice logs (on failure)
        if: failure()
        run: |
          for log in .local-stack/logs/authservice-build.log .local-stack/logs/authservice.log; do
            if [ -f "$log" ]; then
              echo "== $log"
              tail -n 200 "$log"
            fi
          done

  e2e:
    name: Browser journeys (E2E)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.e2e == 'true' && needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The throwaway CI database (same as the other jobs). The value is not a credential.
      PG_CONNECTION: Host=localhost;Username=postgres;Password=postgres # gitleaks:allow
      # A missing stack or browser fails the journeys instead of skipping them (E2E-ACCEPTANCE-TESTING).
      POSTMANCLONE_E2E_REQUIRED: '1'
      # authservice writes an invitation token to its log only in Development, with no email provider (docs/AUTH.md). The
      # sharing journey reads it from there. A throwaway CI estate only; production keeps the token withheld.
      AUTHSERVICE_ENVIRONMENT: Development
      # The demo seed runs at the end of `up` and makes about ten calls (four sign-ins, four registrations, two refreshes) in the same
      # address's authservice window, and several journeys make more than one authservice call per counted action (a form registration
      # signs in and refreshes). The suite therefore treats the whole window as spent at its start and first waits for it to pass, which
      # costs one minute and removes the queueing that made journeys time out (Support/AuthBudget.cs).
      E2E_AUTH_WINDOW_PRESPENT: '18'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the journeys (outside PostmanClone.sln, which the unit run uses; they need the running estate)
        run: dotnet build tests/PostmanClone.Web.E2E/PostmanClone.Web.E2E.csproj --configuration Release

      - name: Install Chromium for Playwright (the suite never downloads one itself)
        run: pwsh tests/PostmanClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # `up agent` also starts the local agent on 127.0.0.1:47631 (WP32). The agent journeys need it in both runs.
      - name: Start the estate with the test-only loopback flag and the local agent
        env:
          E2E_SENDER_LOOPBACK: '1'
          WEB_AUTH_PERMITS_PER_MINUTE: '18'
        run: scripts/run-local-stack.sh up agent

      - name: Journeys that send to the local target (loopback)
        run: |
          set -o pipefail
          dotnet test --project tests/PostmanClone.Web.E2E/PostmanClone.Web.E2E.csproj --configuration Release --no-build --filter "Mode!=strict" 2>&1 | tee e2e-loopback.log

      - name: Which journeys failed (loopback)
        if: failure()
        run: |
          # Annotations are readable without the raw log: one error per failed journey, then the first reasons.
          sed 's/\x1b\[[0-9;]*m//g' e2e-loopback.log > e2e-loopback.plain.log || true
          grep -E "^\s*failed " e2e-loopback.plain.log | cut -c1-240 | while read -r line; do echo "::error title=Failed journey (loopback)::${line}"; done || true
          grep -n -E "Assert\.|Expected|Actual|Timeout|outcome|errorCode|Code:|Error Message" e2e-loopback.plain.log | cut -c1-260 | head -25 | while read -r line; do echo "::warning title=Reason (loopback)::${line}"; done || true
          # What the estate itself logged: login timings and refusals (never a line that holds an invitation token).
          grep -h -i -E "auth/login|RateLimit|Timeout|429" .local-stack/logs/authservice.log .local-stack/logs/web.log 2>/dev/null | grep -v "Invitation token" | cut -c1-230 | tail -20 | while read -r line; do echo "::warning title=Estate log (loopback)::${line}"; done || true

      - name: Stop the estate
        if: always()
        run: scripts/run-local-stack.sh down

      - name: Start the estate without the loopback flag (the default configuration) and the local agent
        env:
          WEB_AUTH_PERMITS_PER_MINUTE: '18'
        run: scripts/run-local-stack.sh up agent

      - name: Journeys that expect the sender to refuse loopback (strict)
        run: |
          set -o pipefail
          dotnet test --project tests/PostmanClone.Web.E2E/PostmanClone.Web.E2E.csproj --configuration Release --no-build --filter "Mode!=loopback" 2>&1 | tee e2e-strict.log

      - name: Which journeys failed (strict)
        if: failure()
        run: |
          # Annotations are readable without the raw log: one error per failed journey, then the first reasons.
          sed 's/\x1b\[[0-9;]*m//g' e2e-strict.log > e2e-strict.plain.log || true
          grep -E "^\s*failed " e2e-strict.plain.log | cut -c1-240 | while read -r line; do echo "::error title=Failed journey (strict)::${line}"; done || true
          grep -n -E "Assert\.|Expected|Actual|Timeout|outcome|errorCode|Code:|Error Message" e2e-strict.plain.log | cut -c1-260 | head -25 | while read -r line; do echo "::warning title=Reason (strict)::${line}"; done || true

      - name: Stop the estate
        if: always()
        run: scripts/run-local-stack.sh down

      - name: Service logs and browser artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            .local-stack/logs/
            tests/PostmanClone.Web.E2E/bin/Release/net10.0/TestResults/
          if-no-files-found: warn
          retention-days: 7

  compose-e2e:
    # ADR-0030, ADR-0031: the container estate. The pinned authservice image runs as a container with PostgreSQL and the services built from
    # their Dockerfiles; the seed runs against it once; Chromium signs in as the seeded owner and member and the shared-collection journey
    # runs against containers (Estate=compose). Only the journeys that need no loopback target and no local agent run here.
    name: Compose estate (containers) and E2E
    needs: [detect-changes]
    if: needs.detect-changes.outputs.e2e == 'true' && needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTMANCLONE_E2E_REQUIRED: '1'
      E2E_LOG_DIR: ${{ github.workspace }}/.local-stack/compose-logs
      E2E_AUTH_WINDOW_PRESPENT: '18'   # the seed's ten calls, the idempotent second run's four, and the form journeys' extra calls
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pull the pinned authservice image (the container path under test)
        run: |
          set -euo pipefail
          image=$(grep -oP 'AUTHSERVICE_IMAGE:-\K[^}]+' compose.yaml)
          echo "Pulling ${image}"
          docker pull "${image}"
          docker image inspect "${image}" --format 'authservice image id: {{.Id}}'

      - name: Build the journeys
        run: dotnet build tests/PostmanClone.Web.E2E/PostmanClone.Web.E2E.csproj --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh tests/PostmanClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Build and start the estate, wait for the seed
        run: scripts/compose-up.sh

      - name: authservice health and a second seed run (idempotent)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:5300/health/ready; echo
          curl -fsS http://localhost:5300/.well-known/jwks.json | python3 -c 'import json,sys; print("JWKS keys:", len(json.load(sys.stdin)["keys"]))'
          scripts/compose-up.sh seed | tee second-seed.log
          grep -q "done (0 item(s) created" second-seed.log

      - name: Journeys against the containers (seeded sign-in, shared collection)
        run: dotnet test --project tests/PostmanClone.Web.E2E/PostmanClone.Web.E2E.csproj --configuration Release --no-build --filter "Estate=compose"

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose -f compose.yaml ps -a || true
          docker compose -f compose.yaml logs --no-color --tail 200 || true
        env:
          JWT_PRIVATE_KEY_PEM: unused-for-logs
          SECRETS_ENCRYPTION_KEY: unused-for-logs

      - name: Stop and remove the estate
        if: always()
        run: scripts/compose-up.sh down -v

      - name: Browser artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-e2e-logs
          path: |
            .local-stack/compose-logs/
            tests/PostmanClone.Web.E2E/bin/Release/net10.0/TestResults/
          if-no-files-found: warn
          retention-days: 7

  aspire-apphost-probe:
    # ADR-0031: the experiment. Does the real AppHost (Aspire's orchestrator, DCP) start the estate on a GitHub runner? Informational: it is
    # not part of the pr-validation aggregate, because the answer is a measurement, not a gate. Its log is the evidence the ADR cites.
    name: Aspire AppHost probe (informational)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.e2e == 'true' && needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start the AppHost and look for the seeded estate
        env:
          PROBE_TIMEOUT: '900'
        run: scripts/aspire-probe.sh

      - name: AppHost log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aspire-apphost-probe-log
          path: .local-stack/logs/
          if-no-files-found: warn
          retention-days: 7

  agent-artifacts:
    # WP30: the local agent as a dotnet tool package and as self-contained single-file programs, uploaded as workflow
    # artifacts only. No release, no tag, no push (ADR-0026, ADR-0027). The publish is run for each platform so a
    # platform that cannot publish fails here, not on a user's machine.
    name: Agent packages (${{ matrix.rid }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/PostmanClone.Agent/PostmanClone.Agent.csproj -r ${{ matrix.rid }}

      - name: Publish self-contained single file
        run: >-
          dotnet publish src/PostmanClone.Agent/PostmanClone.Agent.csproj
          --configuration Release --no-restore
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none
          -o artifacts/${{ matrix.rid }}

      - name: Zip the single file
        run: |
          cd artifacts/${{ matrix.rid }}
          zip -r ../postmanclone-agent-${{ matrix.rid }}.zip .

      - name: Run the single-file program (linux)
        if: matrix.rid == 'linux-x64'
        run: |
          ./artifacts/linux-x64/postmanclone-agent --version
          ./artifacts/linux-x64/postmanclone-agent --help | head -3

      - name: Pack the dotnet tool (once)
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet pack src/PostmanClone.Agent/PostmanClone.Agent.csproj --configuration Release --no-restore -o artifacts/tool
          test -n "$(ls artifacts/tool/*.nupkg 2>/dev/null)" || { echo "The tool package was not produced."; exit 1; }

      - name: Install the tool package from the artifact and run it (linux)
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet tool install PostmanClone.Agent --tool-path "$RUNNER_TEMP/agent-tool" --add-source artifacts/tool --version 0.1.0
          "$RUNNER_TEMP/agent-tool/postmanclone-agent" --version
          "$RUNNER_TEMP/agent-tool/postmanclone-agent" --help | head -3

      - uses: actions/upload-artifact@v7
        with:
          name: postmanclone-agent-${{ matrix.rid }}
          path: artifacts/postmanclone-agent-${{ matrix.rid }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          name: postmanclone-agent-dotnet-tool
          path: artifacts/tool/*.nupkg
          if-no-files-found: error

  docs-links:
    name: Markdown relative links
    needs: [detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check every relative link resolves
        run: bash scripts/check-doc-links.sh

  flyio-config:
    name: Fly configuration (no Fly account)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The Fly workflow is started by workflow_dispatch only (ADR-0029)
        run: bash scripts/check-flyio-trigger.sh

      - name: The Fly configs, the workflow and SECRETS.md agree (and the check rejects broken copies)
        run: python3 scripts/check-flyio-config.py --self-test

  pr-validation:
    name: pr-validation
    needs: [detect-changes, dotnet, docker-build, kernel-size, auth-smoke, e2e, compose-e2e, docs-links, agent-artifacts, flyio-config]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          DOTNET: ${{ needs.dotnet.result }}
          DOCKER: ${{ needs.docker-build.result }}
          KERNEL: ${{ needs.kernel-size.result }}
          AUTH: ${{ needs.auth-smoke.result }}
          E2E: ${{ needs.e2e.result }}
          COMPOSE: ${{ needs.compose-e2e.result }}
          DOCS: ${{ needs.docs-links.result }}
          FLYIO: ${{ needs.flyio-config.result }}
          AGENT: ${{ needs.agent-artifacts.result }}
        run: |
          {
            echo "## PR validation"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Detect inputs | ${DETECT} |"
            echo "| .NET build and tests | ${DOTNET} |"
            echo "| Docker build | ${DOCKER} |"
            echo "| Kernel size | ${KERNEL} |"
            echo "| authservice smoke | ${AUTH} |"
            echo "| Browser journeys (E2E) | ${E2E} |"
            echo "| Compose estate (containers) and E2E | ${COMPOSE} |"
            echo "| Markdown links | ${DOCS} |"
            echo "| Fly configuration | ${FLYIO} |"
            echo "| Agent packages | ${AGENT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$DETECT" "$DOTNET" "$DOCKER" "$KERNEL" "$AUTH" "$E2E" "$COMPOSE" "$DOCS" "$FLYIO" "$AGENT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A validation job ended with: ${result}"; exit 1 ;;
            esac
          done
