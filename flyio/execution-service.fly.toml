# Fly.io configuration for ExecutionService (ADR-0011, ADR-0014, ADR-0015, ADR-0026 Decision 8, ADR-0029). Private.
#
# Deployed by .github/workflows/flyio.yml (workflow_dispatch only) or by hand:
#   flyctl deploy --remote-only -c flyio/execution-service.fly.toml
# Build context: the repository root (see web.fly.toml).
#
# The server sender. It sends to public addresses only: the SSRF guard is ON in Production and must stay on. A local or
# private target is refused with ssrf_blocked_address here; the agent sends those (ADR-0026). Do NOT set
# Execution__Ssrf__AllowLoopback or AllowPrivateRanges: the service refuses them outside Development.

app = "postmanclone-execution"
primary_region = "fra"

[build]
  dockerfile = "../src/PostmanClone.ExecutionService/Dockerfile"
  context = ".."

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"

  Auth__Issuer = "PostmanClone"
  Auth__Audience = "PostmanClone"
  Auth__MetadataAddress = "http://postmanclone-authservice.flycast/.well-known/openid-configuration"
  # DEVIATION (ADR-0029, DEVIATIONS.md): the metadata is read over 6PN without TLS. See web.fly.toml.
  Auth__RequireHttpsMetadata = "false"

  # Where the resolve call goes (ExecutionService Clients/EnvironmentsClientOptions.cs).
  services__environments-service__http__0 = "http://postmanclone-environments.flycast"

  # The connection string (executiondb) is the Fly secret ConnectionStrings__executiondb (flyio/SECRETS.md).

[http_service]
  internal_port = 8080
  # Off: internal address over HTTP only (see authservice.fly.toml).
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scales to zero on purpose. The Web calls it only for a server send (the agent is the default sender), and the first
  # send after a quiet period waits for a cold start. Cost reasoning: FLY_DEPLOYMENT §8. The Web's timeout for this call
  # is 120 s (Web/Api/BackendServices.cs), which covers a cold start.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
