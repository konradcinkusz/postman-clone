# The whole estate as containers (ADR-0030, ADR-0031): PostgreSQL, the pinned authservice image, the three data services, the
# ExecutionService, the Web and the one-shot demo seed. It mirrors src/PostmanClone.AppHost (the same image tag, the same variable
# names, the same signing-key handling); tests/PostmanClone.ServiceDefaults.Tests/Architecture/ComposeParityTests.cs pins that.
#
#   scripts/compose-up.sh            build, start, wait for the seed, print the demo logins   (needs a Docker daemon)
#   scripts/compose-up.sh down       stop; add -v to delete the databases
#
# Development only: plain HTTP, published ports on localhost, published demo passwords. Never deploy this file (ADR-0007, ADR-0029).
# The signing key and the encryption key come from scripts/compose-up.sh (generated into the gitignored .local-stack/) through the
# shell environment. They are never written in this file.

name: postmanclone

x-health: &health
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 10s

# The ASP.NET runtime image has no curl. bash is there, so a health probe is a TCP request written by hand.
x-probe: &probe
  - CMD
  - bash
  - -c
  - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET %s HTTP/1.0\r\nHost: localhost\r\n\r\n" "$$HEALTH_PATH" >&3 && head -n 1 <&3 | grep -q " 200 "'

# What every .NET service needs to trust authservice's tokens. Plain HTTP metadata is for this local composition only.
x-auth-env: &auth-env
  Auth__MetadataAddress: http://authservice:8080/.well-known/openid-configuration
  Auth__Issuer: PostmanClone
  Auth__Audience: PostmanClone
  Auth__RequireHttpsMetadata: "false"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # gitleaks:allow — a local development database, not a credential.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/compose/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The identity provider: the pinned image, never copied into this tree (ADR-0004). AUTHSERVICE_IMAGE lets a runner without access to
  # ghcr.io use an image built from the same tag; the default is the published one.
  authservice:
    image: ${AUTHSERVICE_IMAGE:-ghcr.io/konradcinkusz/authservice:v0.3.4}
    # authservice v0.3.4 returns an invitation token only in an email. With no email provider it writes the token to its log in
    # Development, so the log goes to a folder the seeder (and the test suite) can read. exec keeps dotnet as PID 1 for signals.
    entrypoint: ["/bin/bash", "-c", "mkdir -p /logs && exec dotnet AuthService.dll > >(tee -a /logs/authservice.log) 2>&1"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HEALTH_PATH: /health/ready
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=authdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres} # gitleaks:allow
      Database__SchemaMode: Migrate
      Database__MigrationsAssembly: AuthService.Migrations.PostgreSQL
      Jwt__Issuer: PostmanClone
      Jwt__Audience: PostmanClone
      # The PKCS#8 RSA private key (PEM). Its presence selects RS256. Generated by scripts/compose-up.sh and kept in .local-stack/.
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:?run scripts/compose-up.sh, which generates the signing key}
      # The origin the other containers fetch the JWKS from (the discovery document's jwks_uri).
      Jwt__PublicBaseUrl: http://authservice:8080
      FrontendBaseUrl: http://localhost:5310
    ports:
      - "5300:8080"
    volumes:
      - auth-dataprotection:/root/.aspnet/DataProtection-Keys
      - ./.local-stack/compose-logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: *probe
      <<: *health
    stop_grace_period: 15s

  collections-service:
    build: { context: ., dockerfile: src/PostmanClone.CollectionsService/Dockerfile }
    environment:
      <<: *auth-env
      ConnectionStrings__collectionsdb: Host=postgres;Port=5432;Database=collectionsdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres} # gitleaks:allow
      HEALTH_PATH: /health
    ports: ["5301:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      authservice: { condition: service_healthy }
    healthcheck: { test: *probe, <<: *health }

  environments-service:
    build: { context: ., dockerfile: src/PostmanClone.EnvironmentsService/Dockerfile }
    environment:
      <<: *auth-env
      ConnectionStrings__environmentsdb: Host=postgres;Port=5432;Database=environmentsdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres} # gitleaks:allow
      Secrets__EncryptionKey: ${SECRETS_ENCRYPTION_KEY:?run scripts/compose-up.sh, which generates the encryption key}
      Agent__AllowedWebOrigins__0: http://localhost:5310
      HEALTH_PATH: /health
    ports: ["5302:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      authservice: { condition: service_healthy }
    healthcheck: { test: *probe, <<: *health }

  execution-service:
    build: { context: ., dockerfile: src/PostmanClone.ExecutionService/Dockerfile }
    environment:
      <<: *auth-env
      ConnectionStrings__executiondb: Host=postgres;Port=5432;Database=executiondb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres} # gitleaks:allow
      Environments__BaseAddress: http://environments-service:8080
      HEALTH_PATH: /health
    ports: ["5303:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      authservice: { condition: service_healthy }
      environments-service: { condition: service_healthy }
    healthcheck: { test: *probe, <<: *health }

  web:
    build: { context: ., dockerfile: src/PostmanClone.Web/Dockerfile }
    environment:
      # Development: the session cookie is not Secure-only, because this composition serves plain HTTP on localhost.
      ASPNETCORE_ENVIRONMENT: Development
      HEALTH_PATH: /health
      <<: *auth-env
      # The browser journeys sign in from one address many times (scripts/run-local-stack.sh sets the same).
      RateLimiting__AuthPermitsPerMinute: ${WEB_AUTH_PERMITS_PER_MINUTE:-18}
      services__authservice__http__0: http://authservice:8080
      services__collections-service__http__0: http://collections-service:8080
      services__environments-service__http__0: http://environments-service:8080
      services__execution-service__http__0: http://execution-service:8080
    ports: ["5310:8080"]
    depends_on:
      authservice: { condition: service_healthy }
      collections-service: { condition: service_healthy }
      environments-service: { condition: service_healthy }
      execution-service: { condition: service_healthy }
    healthcheck: { test: *probe, <<: *health }

  # The demo seed: a one-shot client of the APIs above (ADR-0030). It exits 0 when the estate holds the demo data.
  seed:
    build: { context: ., dockerfile: src/PostmanClone.Seeder/Dockerfile }
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Development
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__AuthBaseUrl: http://authservice:8080
      Seed__CollectionsBaseUrl: http://collections-service:8080
      Seed__EnvironmentsBaseUrl: http://environments-service:8080
      Seed__AuthLogPath: /logs/authservice.log
    volumes:
      - ./.local-stack/compose-logs:/logs:ro
    depends_on:
      authservice: { condition: service_healthy }
      collections-service: { condition: service_healthy }
      environments-service: { condition: service_healthy }

volumes:
  postgres-data:
  auth-dataprotection:
